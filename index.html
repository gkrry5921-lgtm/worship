<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCMN 예배팀 출결관리</title>
<style>
:root{
  --green:#075c45;--green2:#0b7458;--navy:#17365f;--line:#d7e0e8;--bg:#f5f7f9;
  --ok:#dff4e7;--okText:#155c3e;--warn:#ffe39a;--warnText:#614900;--bad:#db332d;--badText:white;
  --card:#ffffff;--muted:#6f7b88;--blue:#eaf2ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#142334;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:0 auto;padding:24px}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.title h1{margin:0;color:var(--green);font-size:30px;letter-spacing:-.8px}
.title p{margin:5px 0 0;color:var(--muted);font-size:13px}
.logo{font-weight:900;color:#d7b52e;font-size:22px;line-height:.95;text-align:right;letter-spacing:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(30,52,75,.04)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px}
.controls select,.controls input{height:36px;border:1px solid var(--line);border-radius:9px;background:white;padding:0 10px}
.btn{height:36px;border:1px solid var(--line);background:white;border-radius:9px;padding:0 12px;font-weight:800;color:#32475b}
.btn.primary{background:var(--green);border-color:var(--green);color:white}
.btn.soft{background:#edf7f3;border-color:#cfe7dc;color:var(--green)}
.spacer{flex:1}
.summary{padding:14px 16px;margin-bottom:14px}
.summaryHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.summaryHead h2{margin:0;font-size:18px;color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:13px 12px;text-align:center;background:#fff}
.kpi .label{font-size:12px;font-weight:850;color:#33495d;margin-bottom:4px}
.kpi .num{font-size:32px;font-weight:900;color:var(--green)}
.kpi.bad .num{color:#d12d26}
.kpi .unit{font-size:15px;margin-left:2px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{border:1px solid var(--line);background:white;color:#526173;border-radius:9px;padding:8px 13px;font-weight:850}
.tab.active{background:var(--navy);border-color:var(--navy);color:white}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(420px,.8fr);gap:14px;align-items:start}
.sectionHead{background:var(--navy);color:white;padding:12px 14px;border-radius:13px 13px 0 0;display:flex;align-items:center;justify-content:space-between}
.sectionHead h3{margin:0;font-size:16px}
.sectionHead span{font-size:11px;opacity:.9}
.tableWrap{overflow:auto;border:1px solid var(--line);border-top:0;border-radius:0 0 13px 13px;max-height:720px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:0;z-index:3;background:#eef3f7;color:#203852;font-weight:900;padding:9px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:white}
th:last-child,td:last-child{border-right:0}
tr:hover td{background:#fbfdff}
.name{font-weight:850;white-space:nowrap}
.unit,.role{white-space:nowrap;color:#40546a}.unit:first-child{font-weight:850;color:#17365f}
.status{width:55px;text-align:center;font-weight:900;user-select:none;cursor:pointer;border-radius:6px}
.status.o{background:var(--ok)!important;color:var(--okText)}
.status.xpartial{background:var(--warn)!important;color:var(--warnText)}
.status.xall{background:var(--bad)!important;color:var(--badText)}
.reasonInput{width:100%;min-width:130px;border:0;background:transparent;outline:none;padding:2px 4px;color:#263b50}
.exception td{padding:8px 6px}
.reportPanel{position:sticky;top:14px}
.reportBody{padding:0}
.empty{padding:30px;text-align:center;color:#8a95a2}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef6f2;color:var(--green)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-left:4px}
.search{width:180px}
@media(max-width:1100px){
  .grid{grid-template-columns:1fr}
  .reportPanel{position:static}
}
@media(max-width:760px){
  .app{padding:12px}
  .header{flex-direction:column}
  .title h1{font-size:23px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .kpi:last-child{grid-column:span 2}
  .controls{align-items:stretch}
  .controls select,.controls input,.btn{width:100%}
  .spacer{display:none}
}
@media print{
  body{background:white}
  .controls,.tabs,.leftPanel{display:none!important}
  .app{max-width:none;padding:0}
  .grid{display:block}
  .reportPanel{position:static}
  .panel{border:0;box-shadow:none}
  .header{margin:0 0 10px}
  .reportPanel .sectionHead{border-radius:0}
}

.platoonDivider td{
  background:#17365f !important;
  color:#fff !important;
  font-weight:900;
  text-align:left;
  padding:8px 10px !important;
}
.hqTag{color:#8a6b00;font-weight:900}

@page{
  size:A4 portrait;
  margin:10mm;
}
@media print{
  html,body{
    width:210mm;
    height:297mm;
    background:#fff !important;
    color:#111 !important;
    -webkit-print-color-adjust:exact;
    print-color-adjust:exact;
  }
  body{
    margin:0 !important;
    font-size:10px !important;
  }
  .app{
    max-width:none !important;
    width:auto !important;
    padding:0 !important;
    margin:0 !important;
  }

  /* Keep only the title, summary cards, and exception report */
  .controls,
  .leftPanel,
  .tabs,
  .title p{
    display:none !important;
  }

  .header{
    margin:0 0 6mm !important;
    display:flex !important;
    align-items:flex-start !important;
    justify-content:space-between !important;
    page-break-after:avoid !important;
  }
  .title h1{
    font-size:18px !important;
    margin:0 !important;
  }
  .logo{
    font-size:14px !important;
  }

  .summary{
    margin:0 0 5mm !important;
    padding:4mm !important;
    border:1px solid #cfd7df !important;
    box-shadow:none !important;
    page-break-inside:avoid !important;
  }
  .summaryHead{
    margin-bottom:3mm !important;
  }
  .summaryHead h2{
    font-size:14px !important;
  }
  .badge{
    font-size:9px !important;
    padding:3px 6px !important;
  }
  .kpis{
    grid-template-columns:repeat(5,1fr) !important;
    gap:2.5mm !important;
  }
  .kpi{
    padding:3mm 2mm !important;
    border-radius:5px !important;
    min-height:0 !important;
  }
  .kpi .label{
    font-size:9px !important;
    margin-bottom:1mm !important;
  }
  .kpi .num{
    font-size:22px !important;
  }
  .kpi .unit{
    font-size:10px !important;
  }

  .grid{
    display:block !important;
  }
  .reportPanel{
    display:block !important;
    position:static !important;
    margin:0 !important;
    padding:0 !important;
    border:1px solid #cfd7df !important;
    box-shadow:none !important;
    page-break-inside:avoid !important;
  }
  .reportPanel .sectionHead{
    border-radius:0 !important;
    padding:3mm 4mm !important;
  }
  .reportPanel .sectionHead h3{
    font-size:13px !important;
  }
  .reportPanel .sectionHead span{
    display:none !important;
  }

  .reportPanel .tableWrap{
    max-height:none !important;
    overflow:visible !important;
    border:0 !important;
    border-radius:0 !important;
  }
  .reportPanel table{
    width:100% !important;
    table-layout:fixed !important;
    font-size:9px !important;
    border-collapse:collapse !important;
  }
  .reportPanel th,
  .reportPanel td{
    position:static !important;
    padding:2.1mm 1.3mm !important;
    line-height:1.15 !important;
    border:1px solid #d5dbe1 !important;
    word-break:keep-all !important;
    overflow-wrap:anywhere !important;
  }
  .reportPanel th{
    background:#eef3f7 !important;
    color:#203852 !important;
  }

  .platoonDivider td{
    padding:2mm 2mm !important;
    font-size:9px !important;
  }

  /* Sensible widths for one-page report */
  #exceptionTable th:nth-child(1), #exceptionTable td:nth-child(1){width:12%}
  #exceptionTable th:nth-child(2), #exceptionTable td:nth-child(2){width:11%}
  #exceptionTable th:nth-child(3), #exceptionTable td:nth-child(3){width:13%}
  #exceptionTable th:nth-child(4), #exceptionTable td:nth-child(4),
  #exceptionTable th:nth-child(5), #exceptionTable td:nth-child(5),
  #exceptionTable th:nth-child(6), #exceptionTable td:nth-child(6){width:8%}
  #exceptionTable th:nth-child(7), #exceptionTable td:nth-child(7){width:40%}

  /* Avoid browser-generated extra blank pages where possible */
  *{
    page-break-before:auto !important;
    page-break-after:auto !important;
  }
}


.annualNote{font-size:11px;color:#6f7b88;margin-left:4px}
.annualTable th,.annualTable td{text-align:center}
.annualTable td.name,.annualTable td.unit,.annualTable td.role{text-align:left}
.annualCount{font-weight:900;color:#075c45}
.annualDetailTitle{font-size:13px;font-weight:900;color:#17365f;margin:0 0 8px}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="title">
      <h1>NCMN 예배팀 출결관리</h1>
      <p>월별 훈련모임 · 비전모임 출석 입력 및 자동 보고</p>
    </div>
    <div class="logo">WORSHIP<br>WARRIOR</div>
  </div>

  <div class="panel controls">
    <select id="meetingSelect"></select>
    <select id="platoonFilter"><option value="">전체 소대</option><option value="사령부">사령부</option><option value="1소대">1소대</option><option value="2소대">2소대</option></select>
    <select id="unitFilter"><option value="">전체 분대</option></select>
    <input id="search" class="search" placeholder="이름 검색">
    <div class="spacer"></div>
    <button class="btn soft" id="resetBtn">엑셀 원본으로 초기화</button>
    <button class="btn" id="saveJsonBtn">백업</button>
    <label class="btn" style="display:flex;align-items:center">복원<input id="restoreJson" type="file" accept="application/json" hidden></label>
    <button class="btn primary" onclick="window.print()">보고서 인쇄</button>
  </div>

  <div class="panel summary">
    <div class="summaryHead">
      <h2 id="summaryTitle">전체 출결 현황</h2>
      <span class="badge">거룩! 겸손! 연합</span>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">총원</div><div><span class="num" id="totalNum">0</span><span class="unit">명</span></div></div>
      <div class="kpi bad"><div class="label">결석자</div><div><span class="num" id="absentNum">0</span><span class="unit">명</span></div></div>
      <div class="kpi"><div class="label">중보기도</div><div><span class="num" id="prayerNum">0</span><span class="unit">명</span></div></div>
      <div class="kpi"><div class="label">예배</div><div><span class="num" id="worshipNum">0</span><span class="unit">명</span></div></div>
      <div class="kpi"><div class="label">강의</div><div><span class="num" id="lectureNum">0</span><span class="unit">명</span></div></div>
    </div>
  </div>

  <div class="grid">
    <div class="leftPanel panel">
      <div class="sectionHead">
        <h3>전체 명단 · 출석 입력</h3>
        <span>O / X 칸을 클릭하면 변경됩니다.</span>
      </div>
      <div class="tableWrap">
        <table id="attendanceTable">
          <thead><tr><th>소대</th><th>분대</th><th>직책</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="reportPanel panel">
      <div class="sectionHead">
        <h3>출결 특이사항</h3>
        <span>결석 · 부분참여 · 사유 자동 추출</span>
      </div>
      <div class="reportBody tableWrap" style="max-height:720px">
        <table id="exceptionTable">
          <thead><tr><th>소대</th><th>분대</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

function formatDateLabel(ds){
  if(!ds) return '';
  const d=new Date(ds+'T00:00:00');
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function loadSaved(){
  try{return JSON.parse(localStorage.getItem(STORAGE_KEY)||'null')}catch(e){return null}
}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function isImportedHeaderRow(r){
  const unit=String(r?.unit||'').trim();
  const role=String(r?.role||'').trim();
  const name=String(r?.name||'').trim();
  const prayer=String(r?.prayer||'').trim();
  const worship=String(r?.worship||'').trim();
  const lecture=String(r?.lecture||'').trim();
  return name==='이름' || unit==='분대' || role==='직책' ||
    prayer==='중보기도' || prayer==='중보' || worship==='예배' || lecture==='강의';
}

function isAllX(r){return r.prayer==='X' && r.worship==='X' && r.lecture==='X'}
function isException(r){return isAllX(r)||r.prayer==='X'||r.worship==='X'||r.lecture==='X'||(r.reason||'').trim()}
function statusClass(r,key){
  if(r[key]==='O') return 'o';
  if(r[key]==='X') return isAllX(r)?'xall':'xpartial';
  return '';
}
function cycleStatus(v){return v==='O'?'X':'O'}
function platoonOfRow(r){
  const name=String(r?.name||'').replace(/\s+/g,'').trim();

  if(['김영훈','정혜랑','김광원'].includes(name)) return '사령부';
  if(['성정우','이예림'].includes(name)) return '1소대';
  if(['최민석','홍랑'].includes(name)) return '2소대';

  const unit=String(r?.unit||'').trim();
  const m=unit.match(/(\d+)\s*분대/);
  if(!m) return '';
  const n=Number(m[1]);
  if(n>=1 && n<=5) return '1소대';
  if(n>=6 && n<=10) return '2소대';
  return '';
}

function setup(){
  const ms=document.getElementById('meetingSelect');

  ms.innerHTML=`<option value="__ALL__" ${current==='__ALL__'?'selected':''}>전체 (연간 통계)</option>`+
    Object.keys(db).map(k=>{
      const dt=removedDateFields[k];
      const label=dt ? `${k} · ${formatDateLabel(dt)}` : k;
      return `<option value="${esc(k)}" ${k===current?'selected':''}>${esc(label)}</option>`;
    }).join('');

  ms.onchange=()=>{
    current=ms.value;
    buildUnitFilter();
    render();
  };

  document.getElementById('search').oninput=render;
  document.getElementById('unitFilter').onchange=render;
  document.getElementById('platoonFilter').onchange=()=>{
    buildUnitFilter();
    render();
  };

  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('현재 수정 내용을 지우고 업로드된 엑셀 원본으로 되돌릴까요?')){
      db=JSON.parse(JSON.stringify(ORIGINAL_DATA));
      persist();
      current=Object.keys(db)[0];
      setup();
      render();
    }
  };

  document.getElementById('saveJsonBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='NCMN_예배팀_출결_백업.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById('restoreJson').onchange=async e=>{
    const f=e.target.files[0];
    if(!f) return;
    try{
      const x=JSON.parse(await f.text());
      db=x;
      persist();
      current=Object.keys(db).includes(current)?current:Object.keys(db)[0];
      setup();
      render();
    }catch{
      alert('올바른 백업 파일이 아닙니다.');
    }
    e.target.value='';
  };

  buildUnitFilter();
}



function buildUnitFilter(){
  const p=document.getElementById('platoonFilter')?.value||'';
  const source=(current==='__ALL__' ? Object.values(db).flat() : (db[current]||[])).filter(r=>!isImportedHeaderRow(r));
  const units=[...new Set(source.map(r=>r.unit).filter(Boolean))]
    .filter(x=>!p || platoonOfRow({unit:x,name:''})===p);
  const u=document.getElementById('unitFilter');
  const old=u.value;
  u.innerHTML='<option value="">전체 분대</option>'+units.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  if(units.includes(old))u.value=old;
}

function filteredRows(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const uf=document.getElementById('unitFilter').value;
  const pf=document.getElementById('platoonFilter').value;
  return (db[current]||[]).filter(r=>!isImportedHeaderRow(r)).filter(r=>
    (!pf||platoonOfRow(r)===pf) &&
    (!uf||r.unit===uf) &&
    (!q||`${r.name} ${r.unit} ${r.role} ${r.reason}`.toLowerCase().includes(q))
  );
}

function statusCell(r,idx,key){
  return `<td class="status ${statusClass(r,key)}" data-i="${idx}" data-key="${key}">${esc(r[key]||'O')}</td>`;
}


function uniquePeopleAnnual(){
  const map=new Map();

  Object.entries(db).forEach(([meeting,rows])=>{
    rows.filter(r=>!isImportedHeaderRow(r)).forEach(r=>{
      const cleanName=String(r.name||'').replace(/\s+/g,'').trim();
      if(!cleanName) return;

      if(!map.has(cleanName)){
        map.set(cleanName,{
          name:r.name,
          unit:r.unit,
          role:r.role,
          platoon:platoonOfRow(r),
          meetings:0,
          prayer:0,
          worship:0,
          lecture:0,
          records:[]
        });
      }

      const p=map.get(cleanName);
      const forced=platoonOfRow(r);
      if(forced) p.platoon=forced;
      if(!p.unit && r.unit) p.unit=r.unit;
      if(!p.role && r.role) p.role=r.role;

      const attended=r.prayer==='O'||r.worship==='O'||r.lecture==='O';
      if(attended) p.meetings++;
      if(r.prayer==='O') p.prayer++;
      if(r.worship==='O') p.worship++;
      if(r.lecture==='O') p.lecture++;

      p.records.push({meeting,...r});
    });
  });

  return [...map.values()];
}

  </tr>`;

  const tbody=table.querySelector('tbody');
  tbody.innerHTML=filtered.length ? filtered.map(p=>`<tr>
    <td class="unit">${esc(p.platoon)}</td>
    <td class="unit">${esc(p.unit)}</td>
    <td class="role">${esc(p.role)}</td>
    <td class="name">${esc(p.name)}</td>
    <td class="annualCount">${p.meetings} / ${meetingCount}</td>
    <td>${p.prayer}</td>
    <td>${p.worship}</td>
    <td>${p.lecture}</td>
  </tr>`).join('') : `<tr><td colspan="8" class="empty">검색 결과가 없습니다.</td></tr>`;

  const et=document.getElementById('exceptionTable');
  et.querySelector('thead').innerHTML=`<tr>
    <th>모임</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th>
  </tr>`;

  const details=filtered.flatMap(p=>p.records.map(r=>({...r,person:p.name})));
  const eb=et.querySelector('tbody');
  eb.innerHTML=details.length ? details.map(r=>`<tr class="exception">
    <td>${esc(r.meeting)}</td>
    <td class="name">${esc(r.person)}</td>
    <td class="status ${r.prayer==='O'?'o':'xpartial'}">${esc(r.prayer)}</td>
    <td class="status ${r.worship==='O'?'o':'xpartial'}">${esc(r.worship)}</td>
    <td class="status ${r.lecture==='O'?'o':'xpartial'}">${esc(r.lecture)}</td>
    <td>${esc(r.reason)}</td>
  </tr>`).join('') : `<tr><td colspan="6" class="empty">연간 상세 기록이 없습니다.</td></tr>`;

  document.querySelector('.leftPanel .sectionHead h3').textContent='연간 개인별 출석 통계';
  document.querySelector('.leftPanel .sectionHead span').textContent='이름 검색으로 1년 출석 횟수를 확인할 수 있습니다.';
  document.querySelector('.reportPanel .sectionHead h3').textContent='연간 모임별 상세';
  document.querySelector('.reportPanel .sectionHead span').textContent='검색된 인원의 모임별 O/X와 사유';
}

function render(){
  // 기본 KPI 라벨 복원
  const labels=document.querySelectorAll('.kpi .label');
  labels[0].textContent='총원'; labels[1].textContent='결석자';
  labels[2].textContent='중보기도'; labels[3].textContent='예배'; labels[4].textContent='강의';

  if(current==='__ALL__'){
    renderAnnual();
    return;
  }

  document.getElementById('attendanceTable').classList.remove('annualTable');
  document.getElementById('attendanceTable').querySelector('thead').innerHTML='<tr><th>소대</th><th>분대</th><th>직책</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th></tr>';
  document.getElementById('exceptionTable').querySelector('thead').innerHTML='<tr><th>소대</th><th>분대</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th></tr>';
  document.querySelector('.leftPanel .sectionHead h3').textContent='전체 명단 · 출석 입력';
  document.querySelector('.leftPanel .sectionHead span').textContent='O / X 칸을 클릭하면 변경됩니다.';
  document.querySelector('.reportPanel .sectionHead h3').textContent='출결 특이사항';
  document.querySelector('.reportPanel .sectionHead span').textContent='결석 · 부분참여 · 사유 자동 추출';

  const all=(db[current]||[]).filter(r=>!isImportedHeaderRow(r));
  const dateLabel=removedDateFields[current]?` · ${formatDateLabel(removedDateFields[current])}`:'';
  document.getElementById('summaryTitle').textContent=`${current}${dateLabel} 전체 출결 현황`;
  // 성정우가 1소대/5분대에 중복 등록되어 있어 상단 통계는 각 항목에서 1명 차감
  const DUPLICATE_ADJUSTMENT = 1;
  // 성정우가 명단에 2번 들어가므로 총원은 중복 1명 차감
  document.getElementById('totalNum').textContent=Math.max(0, all.length - 1);
  document.getElementById('absentNum').textContent=Math.max(0,all.filter(isAllX).length-DUPLICATE_ADJUSTMENT);
  document.getElementById('prayerNum').textContent=Math.max(0,all.filter(r=>r.prayer==='O').length-DUPLICATE_ADJUSTMENT);
  document.getElementById('worshipNum').textContent=Math.max(0,all.filter(r=>r.worship==='O').length-DUPLICATE_ADJUSTMENT);
  document.getElementById('lectureNum').textContent=Math.max(0,all.filter(r=>r.lecture==='O').length-DUPLICATE_ADJUSTMENT);

  const rows=filteredRows().filter(r=>!isImportedHeaderRow(r));
  const tbody=document.querySelector('#attendanceTable tbody');
  let seenTwo=false;
  tbody.innerHTML=rows.map(r=>{
    const idx=all.indexOf(r);
    const platoon=platoonOfRow(r);
    let divider='';
    if(platoon==='2소대' && !seenTwo){
      seenTwo=true;
      divider='<tr class="platoonDivider"><td colspan="8">2소대</td></tr>';
    }
    return `${divider}<tr>
      <td class="unit ${platoon==='사령부'?'hqTag':''}">${esc(platoon)}</td>
      <td class="unit">${esc(r.unit)}</td><td class="role">${esc(r.role)}</td><td class="name">${esc(r.name)}</td>
      ${statusCell(r,idx,'prayer')}${statusCell(r,idx,'worship')}${statusCell(r,idx,'lecture')}
      <td><input class="reasonInput" data-i="${idx}" value="${esc(r.reason)}"></td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.status').forEach(td=>td.onclick=()=>{
    const i=+td.dataset.i,key=td.dataset.key;
    db[current][i][key]=cycleStatus(db[current][i][key]||'O');persist();render();
  });
  tbody.querySelectorAll('.reasonInput').forEach(inp=>inp.onchange=()=>{
    db[current][+inp.dataset.i].reason=inp.value;persist();render();
  });

  const ex=all.filter(isException);
  const et=document.querySelector('#exceptionTable tbody');
  if(ex.length){
    let seenTwoEx=false;
    et.innerHTML=ex.map(r=>{
      const platoon=platoonOfRow(r);
      let divider='';
      if(platoon==='2소대' && !seenTwoEx){
        seenTwoEx=true;
        divider='<tr class="platoonDivider"><td colspan="7">2소대</td></tr>';
      }
      return `${divider}<tr class="exception">
        <td class="unit ${platoon==='사령부'?'hqTag':''}">${esc(platoon)}</td>
        <td class="unit">${esc(r.unit)}</td><td class="name">${esc(r.name)}</td>
        <td class="status ${statusClass(r,'prayer')}">${esc(r.prayer)}</td>
        <td class="status ${statusClass(r,'worship')}">${esc(r.worship)}</td>
        <td class="status ${statusClass(r,'lecture')}">${esc(r.lecture)}</td>
        <td>${esc(r.reason)}</td>
      </tr>`;
    }).join('');
  }else{
    et.innerHTML='<tr><td colspan="7" class="empty">특이사항 대상자가 없습니다.</td></tr>';
  }
}

setup();render();
</script>
</body>
</html>
