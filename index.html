<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NCMN 예배팀 출결관리</title>
<style>
:root{
  --green:#075c45;--green2:#0b7458;--navy:#17365f;--line:#d7e0e8;--bg:#f5f7f9;
  --ok:#dff4e7;--okText:#155c3e;--warn:#ffe39a;--warnText:#614900;--bad:#db332d;--badText:white;
  --card:#ffffff;--muted:#6f7b88;--blue:#eaf2ff;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#142334;font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
button,input,select{font:inherit}
button{cursor:pointer}
.app{max-width:1500px;margin:0 auto;padding:24px}
.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}
.title h1{margin:0;color:var(--green);font-size:30px;letter-spacing:-.8px}
.title p{margin:5px 0 0;color:var(--muted);font-size:13px}
.logo{font-weight:900;color:#d7b52e;font-size:22px;line-height:.95;text-align:right;letter-spacing:1px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 5px 18px rgba(30,52,75,.04)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:14px 16px;margin-bottom:14px}
.controls select,.controls input{height:36px;border:1px solid var(--line);border-radius:9px;background:white;padding:0 10px}
.btn{height:36px;border:1px solid var(--line);background:white;border-radius:9px;padding:0 12px;font-weight:800;color:#32475b}
.btn.primary{background:var(--green);border-color:var(--green);color:white}
.btn.soft{background:#edf7f3;border-color:#cfe7dc;color:var(--green)}
.spacer{flex:1}
.summary{padding:14px 16px;margin-bottom:14px}
.summaryHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.summaryHead h2{margin:0;font-size:18px;color:var(--green)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:13px 12px;text-align:center;background:#fff}
.kpi .label{font-size:12px;font-weight:850;color:#33495d;margin-bottom:4px}
.kpi .num{font-size:32px;font-weight:900;color:var(--green)}
.kpi.bad .num{color:#d12d26}
.kpi .unit{font-size:15px;margin-left:2px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tab{border:1px solid var(--line);background:white;color:#526173;border-radius:9px;padding:8px 13px;font-weight:850}
.tab.active{background:var(--navy);border-color:var(--navy);color:white}
.grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(420px,.8fr);gap:14px;align-items:start}
.sectionHead{background:var(--navy);color:white;padding:12px 14px;border-radius:13px 13px 0 0;display:flex;align-items:center;justify-content:space-between}
.sectionHead h3{margin:0;font-size:16px}
.sectionHead span{font-size:11px;opacity:.9}
.tableWrap{overflow:auto;border:1px solid var(--line);border-top:0;border-radius:0 0 13px 13px;max-height:720px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:12px}
th{position:sticky;top:0;z-index:3;background:#eef3f7;color:#203852;font-weight:900;padding:9px 7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:white}
th:last-child,td:last-child{border-right:0}
tr:hover td{background:#fbfdff}
.name{font-weight:850;white-space:nowrap}
.unit,.role{white-space:nowrap;color:#40546a}.unit:first-child{font-weight:850;color:#17365f}
.status{width:55px;text-align:center;font-weight:900;user-select:none;cursor:pointer;border-radius:6px}
.status.o{background:var(--ok)!important;color:var(--okText)}
.status.xpartial{background:var(--warn)!important;color:var(--warnText)}
.status.xall{background:var(--bad)!important;color:var(--badText)}
.reasonInput{width:100%;min-width:130px;border:0;background:transparent;outline:none;padding:2px 4px;color:#263b50}
.exception td{padding:8px 6px}
.reportPanel{position:sticky;top:14px}
.reportBody{padding:0}
.empty{padding:30px;text-align:center;color:#8a95a2}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;padding:5px 8px;border-radius:999px;background:#eef6f2;color:var(--green)}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin-left:4px}
.search{width:180px}




.platoonDivider td{
  background:#17365f !important;
  color:#fff !important;
  font-weight:900;
  text-align:left;
  padding:8px 10px !important;
}
.hqTag{color:#8a6b00;font-weight:900}





.annualNote{font-size:11px;color:#6f7b88;margin-left:4px}
.annualTable th,.annualTable td{text-align:center}
.annualTable td.name,.annualTable td.unit,.annualTable td.role{text-align:left}
.annualCount{font-weight:900;color:#075c45}
.annualDetailTitle{font-size:13px;font-weight:900;color:#17365f;margin:0 0 8px}









html,body{min-width:1180px;}
body{overflow-x:auto;}


/* desktop container alignment */
@media (min-width:761px){

    width:calc(100% - 48px) !important;
    max-width:1480px !important;
    min-width:1180px !important;
    margin:0 auto !important;
    padding:20px 0 28px !important;
  }

    width:100% !important;
    box-sizing:border-box !important;
  }

    width:100% !important;

  .leftPanel,

    display:block !important;

  /* Preserve PC table structure */

function formatDateLabel(ds){
  if(!ds) return '';
  const d=new Date(ds+'T00:00:00');
  return `${d.getFullYear()}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getDate()).padStart(2,'0')}`;
}

function loadSaved(){
  function validDb(x){
    return x && typeof x==='object' && !Array.isArray(x) &&
      Object.values(x).every(v=>Array.isArray(v));
  }

  try{
    const fresh=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(validDb(fresh)){
      // Always start from the newest embedded Excel data.
      // Existing saved sheets may override matching meetings,
      // but newly-added meetings must never disappear.
      const merged=JSON.parse(JSON.stringify(ORIGINAL_DATA));
      Object.keys(fresh).forEach(k=>{
        if(Array.isArray(fresh[k]) && Object.prototype.hasOwnProperty.call(ORIGINAL_DATA,k)){
          merged[k]=fresh[k];
        }
      });
      localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));
      return merged;
    }

    const legacy=JSON.parse(localStorage.getItem(LEGACY_STORAGE_KEY)||'null');
    if(validDb(legacy)){
      const merged=JSON.parse(JSON.stringify(ORIGINAL_DATA));
      Object.keys(legacy).forEach(k=>{
        if(Array.isArray(legacy[k]) && Object.prototype.hasOwnProperty.call(ORIGINAL_DATA,k)){
          merged[k]=legacy[k];
        }
      });
      localStorage.setItem(STORAGE_KEY,JSON.stringify(merged));
      return merged;
    }
  }catch(e){}

  return JSON.parse(JSON.stringify(ORIGINAL_DATA));
}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(db))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function isImportedHeaderRow(r){
  const unit=String(r?.unit||'').trim();
  const role=String(r?.role||'').trim();
  const name=String(r?.name||'').trim();
  const prayer=String(r?.prayer||'').trim();
  const worship=String(r?.worship||'').trim();
  const lecture=String(r?.lecture||'').trim();
  return name==='이름' || unit==='분대' || role==='직책' ||
    prayer==='중보기도' || prayer==='중보' || worship==='예배' || lecture==='강의';
}

function isAllX(r){return r.prayer==='X' && r.worship==='X' && r.lecture==='X'}
function isException(r){return isAllX(r)||r.prayer==='X'||r.worship==='X'||r.lecture==='X'||(r.reason||'').trim()}
function statusClass(r,key){
  if(r[key]==='O') return 'o';
  if(r[key]==='X') return isAllX(r)?'xall':'xpartial';
  return '';
}
function cycleStatus(v){return v==='O'?'X':'O'}
function platoonOfRow(r){
  const name=String(r?.name||'').replace(/\s+/g,'').trim();

  if(['김영훈','정혜랑','김광원'].includes(name)) return '사령부';
  if(['성정우','이예림'].includes(name)) return '1소대';
  if(['최민석','홍랑'].includes(name)) return '2소대';

  const unit=String(r?.unit||'').trim();
  const m=unit.match(/(\d+)\s*분대/);
  if(!m) return '';
  const n=Number(m[1]);
  if(n>=1 && n<=5) return '1소대';
  if(n>=6 && n<=10) return '2소대';
  return '';
}

function setup(){
  const ms=document.getElementById('meetingSelect');

  ms.innerHTML=`<option value="__ALL__" ${current==='__ALL__'?'selected':''}>전체 (연간 통계)</option>`+
    Object.keys(db).map(k=>{
      const dt=meetingDates[k];
      const label=dt ? `${k}(${formatDateLabel(dt)})` : k;
      return `<option value="${esc(k)}" ${k===current?'selected':''}>${esc(label)}</option>`;
    }).join('');

  ms.onchange=()=>{
    current=ms.value;

    // 전체(연간 통계)로 들어갈 때 이전 모임의 소대/분대 필터가
    // 남아서 검색 결과를 막지 않도록 자동 초기화
    if(current==='__ALL__'){
      document.getElementById('platoonFilter').value='';
      document.getElementById('unitFilter').value='';
    }

    buildUnitFilter();
    render();
  };

  const searchEl=document.getElementById('search');
  searchEl.oninput=render;
  searchEl.onkeyup=render;
  document.getElementById('unitFilter').onchange=render;
  document.getElementById('platoonFilter').onchange=()=>{
    buildUnitFilter();
    render();
  };

  document.getElementById('resetBtn').onclick=()=>{
    if(confirm('현재 수정 내용을 지우고 업로드된 엑셀 원본으로 되돌릴까요?')){
      db=JSON.parse(JSON.stringify(ORIGINAL_DATA));
      persist();
      current=Object.keys(db)[0];
      setup();
      render();
    }
  };

  document.getElementById('saveJsonBtn').onclick=()=>{
    const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='NCMN_예배팀_출결_백업.json';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById('restoreJson').onchange=async e=>{
    const f=e.target.files[0];
    if(!f) return;
    try{
      const x=JSON.parse(await f.text());
      db=x;
      persist();
      current=Object.keys(db).includes(current)?current:Object.keys(db)[0];
      setup();
      render();
    }catch{
      alert('올바른 백업 파일이 아닙니다.');
    }
    e.target.value='';
  };

  buildUnitFilter();
}



function buildUnitFilter(){
  const p=document.getElementById('platoonFilter')?.value||'';
  const source=(current==='__ALL__' ? Object.values(db).flat() : (db[current]||[])).filter(r=>!isImportedHeaderRow(r));
  const units=[...new Set(source.map(r=>r.unit).filter(Boolean))]
    .filter(x=>!p || platoonOfRow({unit:x,name:''})===p);
  const u=document.getElementById('unitFilter');
  const old=u.value;
  u.innerHTML='<option value="">전체 분대</option>'+units.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  if(units.includes(old))u.value=old;
}

function filteredRows(){
  const q=document.getElementById('search').value.trim().toLowerCase();
  const uf=document.getElementById('unitFilter').value;
  const pf=document.getElementById('platoonFilter').value;
  return (db[current]||[]).filter(r=>!isImportedHeaderRow(r)).filter(r=>
    (!pf||platoonOfRow(r)===pf) &&
    (!uf||r.unit===uf) &&
    (!q||`${r.name} ${r.unit} ${r.role} ${r.reason}`.toLowerCase().includes(q))
  );
}

function statusCell(r,idx,key){
  return `<td class="status ${statusClass(r,key)}" data-i="${idx}" data-key="${key}">${esc(r[key]||'O')}</td>`;
}


function uniquePeopleAnnual(){
  const people=new Map();

  Object.entries(db).forEach(([meeting,rows])=>{
    if(!Array.isArray(rows)) return;

    const perMeeting=new Map();

    rows.filter(r=>r && typeof r==='object' && !isImportedHeaderRow(r)).forEach(r=>{
      const cleanName=String(r.name||'').replace(/\s+/g,'').trim();
      if(!cleanName) return;

      if(!perMeeting.has(cleanName)){
        perMeeting.set(cleanName,{
          name:String(r.name||'').trim(),
          unit:String(r.unit||'').trim(),
          role:String(r.role||'').trim(),
          platoon:platoonOfRow(r),
          prayer:false,worship:false,lecture:false,reasons:[]
        });
      }

      const m=perMeeting.get(cleanName);
      const pl=platoonOfRow(r);
      if(pl) m.platoon=pl;
      if(!m.unit && r.unit) m.unit=String(r.unit).trim();
      if(!m.role && r.role) m.role=String(r.role).trim();
      if(r.prayer==='O') m.prayer=true;
      if(r.worship==='O') m.worship=true;
      if(r.lecture==='O') m.lecture=true;
      if(String(r.reason||'').trim()) m.reasons.push(String(r.reason).trim());
    });

    perMeeting.forEach((m,cleanName)=>{
      if(!people.has(cleanName)){
        people.set(cleanName,{
          name:m.name,unit:m.unit,role:m.role,platoon:m.platoon,
          meetings:0,prayer:0,worship:0,lecture:0,
          full:0,partial:0,absent:0,total:0,records:[]
        });
      }

      const p=people.get(cleanName);
      if(m.platoon) p.platoon=m.platoon;
      if(!p.unit && m.unit) p.unit=m.unit;
      if(!p.role && m.role) p.role=m.role;

      const attendedCount=[m.prayer,m.worship,m.lecture].filter(Boolean).length;
      const attendanceType=attendedCount===3 ? '전체 참석' : (attendedCount===0 ? '불참' : '부분 참석');

      p.total++;
      if(attendanceType==='전체 참석') p.full++;
      else if(attendanceType==='부분 참석') p.partial++;
      else p.absent++;

      if(attendedCount>0) p.meetings++;
      if(m.prayer) p.prayer++;
      if(m.worship) p.worship++;
      if(m.lecture) p.lecture++;

      p.records.push({
        meeting,
        attendanceType,
        prayer:m.prayer?'O':'X',
        worship:m.worship?'O':'X',
        lecture:m.lecture?'O':'X',
        reason:[...new Set(m.reasons)].join(', ')
      });
    });
  });

  return [...people.values()];
}

function renderAnnual(){
  const people=uniquePeopleAnnual();
  const q=document.getElementById('search').value.trim().toLowerCase();
  const pf=document.getElementById('platoonFilter').value;
  const uf=document.getElementById('unitFilter').value;

  const filtered=people.filter(p=>{
    const hay=`${p.name} ${p.unit} ${p.role} ${p.platoon}`.toLowerCase();
    const matchesSearch=!q || hay.includes(q);
    const matchesPlatoon=!pf || p.platoon===pf;
    const matchesUnit=!uf || p.unit===uf;
    return matchesSearch && matchesPlatoon && matchesUnit;
  });

  const meetingCount=Object.keys(db).length;
  document.getElementById('summaryTitle').textContent='2026년 전체 출결 통계';

  const labels=document.querySelectorAll('.kpi .label');
  labels[0].textContent='총 모임';
  labels[1].textContent='검색 인원';
  labels[2].textContent='전체 참석';
  labels[3].textContent='부분 참석';
  labels[4].textContent='불참';

  document.getElementById('totalNum').textContent=meetingCount;
  document.getElementById('absentNum').textContent=filtered.length;
  document.getElementById('prayerNum').textContent=filtered.reduce((s,p)=>s+p.full,0);
  document.getElementById('worshipNum').textContent=filtered.reduce((s,p)=>s+p.partial,0);
  document.getElementById('lectureNum').textContent=filtered.reduce((s,p)=>s+p.absent,0);

  const table=document.getElementById('attendanceTable');
  table.classList.add('annualTable');
  table.querySelector('thead').innerHTML=`<tr>
    <th>소대</th><th>분대</th><th>직책</th><th>이름</th>
    <th>전체 참석</th><th>부분 참석</th><th>불참</th><th>총 모임</th>
  </tr>`;

  const tbody=table.querySelector('tbody');
  tbody.innerHTML=filtered.length ? filtered.map(p=>`<tr>
    <td class="unit">${esc(p.platoon)}</td>
    <td class="unit">${esc(p.unit)}</td>
    <td class="role">${esc(p.role)}</td>
    <td class="name">${esc(p.name)}</td>
    <td class="annualCount">${p.full}</td>
    <td class="annualCount">${p.partial}</td>
    <td class="annualCount">${p.absent}</td>
    <td class="annualCount">${p.total}</td>
  </tr>`).join('') : `<tr><td colspan="8" class="empty">검색 결과가 없습니다.</td></tr>`;

  const et=document.getElementById('exceptionTable');
  et.querySelector('thead').innerHTML=`<tr>
    <th>모임</th><th>이름</th><th>출결 구분</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th>
  </tr>`;

  const details=filtered.flatMap(p=>p.records.map(r=>({...r,person:p.name})));
  const eb=et.querySelector('tbody');
  eb.innerHTML=details.length ? details.map(r=>`<tr class="exception">
    <td>${esc(r.meeting)}</td>
    <td class="name">${esc(r.person)}</td>
    <td class="annualType">${esc(r.attendanceType)}</td>
    <td class="status ${r.prayer==='O'?'o':'xpartial'}">${esc(r.prayer)}</td>
    <td class="status ${r.worship==='O'?'o':'xpartial'}">${esc(r.worship)}</td>
    <td class="status ${r.lecture==='O'?'o':'xpartial'}">${esc(r.lecture)}</td>
    <td>${esc(r.reason)}</td>
  </tr>`).join('') : `<tr><td colspan="7" class="empty">연간 상세 기록이 없습니다.</td></tr>`;

  document.querySelector('.leftPanel .sectionHead h3').textContent='연간 개인별 출석 통계';
  document.querySelector('.leftPanel .sectionHead span').textContent='전체 참석 · 부분 참석 · 불참 횟수를 확인할 수 있습니다.';
  document.querySelector('.reportPanel .sectionHead h3').textContent='연간 모임별 상세';
  document.querySelector('.reportPanel .sectionHead span').textContent='검색된 인원의 모임별 출결 구분 · O/X · 사유';
}




function render(){
  

  const labels=document.querySelectorAll('.kpi .label');
  labels[0].textContent='총원';
  labels[1].textContent='결석자';
  labels[2].textContent='중보기도';
  labels[3].textContent='예배';
  labels[4].textContent='강의';

  if(current==='__ALL__'){
    renderAnnual();
    return;
  }

  const attendanceTable=document.getElementById('attendanceTable');
  const exceptionTable=document.getElementById('exceptionTable');
  attendanceTable.classList.remove('annualTable');

  attendanceTable.querySelector('thead').innerHTML='<tr><th>소대</th><th>분대</th><th>직책</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th></tr>';
  exceptionTable.querySelector('thead').innerHTML='<tr><th>소대</th><th>분대</th><th>이름</th><th>중보</th><th>예배</th><th>강의</th><th>사유</th></tr>';

  document.querySelector('.leftPanel .sectionHead h3').textContent='전체 명단 · 출석 입력';
  document.querySelector('.leftPanel .sectionHead span').textContent='O / X 칸을 클릭하면 변경됩니다.';
  document.querySelector('.reportPanel .sectionHead h3').textContent='출결 특이사항';
  document.querySelector('.reportPanel .sectionHead span').textContent='결석 · 부분참여 · 사유 자동 추출';

  const source=db[current]||[];
  const entries=source.map((r,i)=>({r,i})).filter(x=>!isImportedHeaderRow(x.r));
  const all=entries.map(x=>x.r);

  const dateLabel=meetingDates[current]?`(${formatDateLabel(meetingDates[current])})`:'';
  document.getElementById('summaryTitle').textContent=`${current}${dateLabel} 전체 출결 현황`;

  const DUPLICATE_ADJUSTMENT=1;
  document.getElementById('totalNum').textContent=Math.max(0,all.length-DUPLICATE_ADJUSTMENT);
  document.getElementById('absentNum').textContent=Math.max(0,all.filter(isAllX).length-DUPLICATE_ADJUSTMENT);
  document.getElementById('prayerNum').textContent=Math.max(0,all.filter(r=>r.prayer==='O').length-DUPLICATE_ADJUSTMENT);
  document.getElementById('worshipNum').textContent=Math.max(0,all.filter(r=>r.worship==='O').length-DUPLICATE_ADJUSTMENT);
  document.getElementById('lectureNum').textContent=Math.max(0,all.filter(r=>r.lecture==='O').length-DUPLICATE_ADJUSTMENT);

  const q=document.getElementById('search').value.trim().toLowerCase();
  const uf=document.getElementById('unitFilter').value;
  const pf=document.getElementById('platoonFilter').value;

  const visible=entries.filter(({r})=>
    (!pf||platoonOfRow(r)===pf) &&
    (!uf||r.unit===uf) &&
    (!q||`${r.name} ${r.unit} ${r.role} ${r.reason}`.toLowerCase().includes(q))
  );

  const tbody=attendanceTable.querySelector('tbody');
  let section='';
  tbody.innerHTML=visible.map(({r,i})=>{
    const platoon=platoonOfRow(r);
    let divider='';
    if(platoon && platoon!==section){
      section=platoon;
      divider=`<tr class="platoonDivider"><td colspan="8">${esc(platoon)}</td></tr>`;
    }

    return `${divider}<tr>
      <td class="unit ${platoon==='사령부'?'hqTag':''}">${esc(platoon)}</td>
      <td class="unit">${esc(r.unit)}</td>
      <td class="role">${esc(r.role)}</td>
      <td class="name">${esc(r.name)}</td>
      ${statusCell(r,i,'prayer')}${statusCell(r,i,'worship')}${statusCell(r,i,'lecture')}
      <td><input class="reasonInput" data-i="${i}" value="${esc(r.reason)}"></td>
    </tr>`;
  }).join('');

  tbody.querySelectorAll('.status').forEach(td=>td.onclick=()=>{
    const i=Number(td.dataset.i);
    const key=td.dataset.key;
    db[current][i][key]=cycleStatus(db[current][i][key]||'O');
    persist();
    render();
  });

  tbody.querySelectorAll('.reasonInput').forEach(inp=>inp.onchange=()=>{
    const i=Number(inp.dataset.i);
    db[current][i].reason=inp.value;
    persist();
    render();
  });

  const exceptions=entries.filter(({r})=>isException(r));
  const eb=exceptionTable.querySelector('tbody');
  if(exceptions.length){
    let exSection='';
    eb.innerHTML=exceptions.map(({r})=>{
      const platoon=platoonOfRow(r);
      let divider='';
      if(platoon && platoon!==exSection){
        exSection=platoon;
        divider=`<tr class="platoonDivider"><td colspan="7">${esc(platoon)}</td></tr>`;
      }
      return `${divider}<tr class="exception">
        <td class="unit ${platoon==='사령부'?'hqTag':''}">${esc(platoon)}</td>
        <td class="unit">${esc(r.unit)}</td>
        <td class="name">${esc(r.name)}</td>
        <td class="status ${statusClass(r,'prayer')}">${esc(r.prayer)}</td>
        <td class="status ${statusClass(r,'worship')}">${esc(r.worship)}</td>
        <td class="status ${statusClass(r,'lecture')}">${esc(r.lecture)}</td>
        <td>${esc(r.reason)}</td>
      </tr>`;
    }).join('');
  }else{
    eb.innerHTML='<tr><td colspan="7" class="empty">특이사항 대상자가 없습니다.</td></tr>';
  }
}

setup();render();

<script id="readonlyGuard">
(function(){
  const tableSelector = '#attendanceTable, #exceptionTable';

  function lockReasonInputs(root=document){
    root.querySelectorAll('.reasonInput, #attendanceTable input, #exceptionTable input').forEach(el=>{
      el.readOnly = true;
      el.disabled = false; // keep readable/selectable styling if browser allows
      el.setAttribute('aria-readonly','true');
      el.tabIndex = -1;
    });
  }

  function isEditTarget(target){
    if (!target) return false;
    return !!(
      target.closest('.status') ||
      target.closest('.statusCell') ||
      target.closest('#attendanceTable td[data-field]') ||
      target.closest('#exceptionTable td[data-field]') ||
      target.closest('.reasonInput')
    );
  }

  // Block click/double-click on editable attendance cells before app handlers receive them.
  ['click','dblclick','mousedown','touchstart','keydown','input','change'].forEach(evtName=>{
    document.addEventListener(evtName, function(e){
      if (isEditTarget(e.target)) {
        if (evtName === 'keydown' && ['Tab','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        e.stopPropagation();
      }
    }, true);
  });

  // Keep dynamically re-rendered reason inputs read-only.
  const observer = new MutationObserver(()=>lockReasonInputs());
  observer.observe(document.documentElement, {subtree:true, childList:true});
  lockReasonInputs();

  // Remove/hide modifying controls if present.
  ['resetBtn','restoreJsonBtn','saveJsonBtn'].forEach(id=>{
    const el = document.getElementById(id);
    if (el) el.style.display='none';
  });
})();
